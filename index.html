<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iOS WebClip配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="产品图库">

    <!-- 应用图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="120x120" href="assets/icons/icon-120.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- 主题颜色 -->
    <meta name="theme-color" content="#007AFF">

    <title>产品图库</title>
    <!-- v3 -->

    <!-- 样式表 -->
    <link rel="stylesheet" href="css/reset.css?v=2">
    <link rel="stylesheet" href="css/variables.css?v=2">
    <link rel="stylesheet" href="css/layout.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=2">
    <link rel="stylesheet" href="css/pages.css?v=2">
    <link rel="stylesheet" href="css/animations.css?v=2">
    <!-- iOS 12兼容性补丁 -->
    <link rel="stylesheet" href="css/compatibility.css?v=1">
</head>

<body>
    <!-- 应用容器 -->
    <div id="app">
        <!-- 主页面 -->
        <div id="page-home" class="page active">
            <!-- 导航栏 -->
            <nav class="navbar">
                <h1 class="navbar-title" style="position: static; transform: none; text-align: left; max-width: none;">
                    产品图库</h1>
                <div class="navbar-actions">
                    <button class="navbar-btn" id="btn-edit"
                        style="position: relative; z-index: 1; margin-right: 4px;">编辑</button>
                    <button class="icon-btn" id="btn-add" aria-label="添加产品">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btn-import" aria-label="导入ZIP">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btn-export" aria-label="导出ZIP">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-15"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </button>
                </div>
            </nav>

            <!-- 搜索框 -->
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search-input" placeholder="搜索产品货号" autocomplete="off">
                    <button class="search-clear" id="search-clear" style="display: none;">×</button>
                </div>
            </div>

            <!-- 产品列表 -->
            <div class="content-container" id="products-container">
                <div class="product-list" id="product-list">
                    <!-- 产品卡片将通过JavaScript动态生成 -->
                </div>
                <div class="empty-state" id="empty-state" style="display: none;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>暂无产品</p>
                    <button class="btn-primary" id="btn-add-first">添加产品</button>
                </div>
            </div>
        </div>

        <!-- 添加产品页面 -->
        <div id="page-add" class="page">
            <nav class="navbar">
                <button class="navbar-btn" id="btn-add-cancel">取消</button>
                <h1 class="navbar-title">添加产品</h1>
                <button class="navbar-btn primary" id="btn-add-save">保存</button>
            </nav>

            <div class="content-container">
                <div class="form-group">
                    <label for="input-product-code">产品货号</label>
                    <input type="text" id="input-product-code" class="input-field" placeholder="请输入产品货号">
                </div>

                <div class="form-group">
                    <label>产品图片</label>
                    <div class="image-upload-buttons">
                        <label for="file-camera" class="upload-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                </path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            拍照
                        </label>
                        <input type="file" id="file-camera" accept="image/*" capture="camera" style="display: none;"
                            multiple>

                        <label for="file-gallery" class="upload-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            从相册选择
                        </label>
                        <input type="file" id="file-gallery" accept="image/*" style="display: none;" multiple>
                    </div>

                    <div class="image-preview-grid" id="image-preview-grid">
                        <!-- 图片预览将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 产品详情页面 -->
        <div id="page-detail" class="page">
            <nav class="navbar">
                <button class="navbar-btn" id="btn-detail-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    返回
                </button>
                <h1 class="navbar-title" id="detail-product-code"></h1>
                <button class="icon-btn danger" id="btn-delete-product" aria-label="删除产品">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </nav>

            <div class="content-container" id="detail-images-container">
                <div class="image-grid" id="detail-image-grid">
                    <!-- 图片网格将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <!-- 设置页面 -->
        <div id="page-settings" class="page">
            <nav class="navbar">
                <button class="icon-btn" id="btn-settings-back" aria-label="返回">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h1 class="navbar-title">更多</h1>
                <div style="width: 48px;"></div>
            </nav>

            <div class="content-container">
                <!-- 外观设置 -->
                <div class="settings-section">
                    <h2 class="section-title">外观</h2>
                    <div class="settings-item theme-option" onclick="setTheme('light')">
                        <div class="settings-item-content">
                            <div class="settings-item-label">浅色模式</div>
                        </div>
                        <svg class="theme-check" id="check-light" style="display: none;" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="settings-item theme-option" onclick="setTheme('dark')">
                        <div class="settings-item-content">
                            <div class="settings-item-label">深色模式</div>
                        </div>
                        <svg class="theme-check" id="check-dark" style="display: none;" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="settings-item theme-option" onclick="setTheme('system')">
                        <div class="settings-item-content">
                            <div class="settings-item-label">跟随系统</div>
                        </div>
                        <svg class="theme-check" id="check-system" style="display: none;" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>

                <!-- 资源下载 -->
                <div class="settings-section">
                    <h2 class="section-title">资源</h2>
                    <div class="settings-item" onclick="window.open('https://www.ilanzou.com/s/qLrndxtV', '_blank')">
                        <div class="settings-item-content">
                            <div class="settings-item-label">下载产品包</div>
                            <div class="settings-item-desc">获取最新产品数据包</div>
                        </div>
                        <svg class="settings-item-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <div class="settings-section">
                    <h2 class="section-title">存储管理</h2>
                    <div class="settings-item" id="btn-storage-info">
                        <div class="settings-item-content">
                            <div class="settings-item-label">存储空间</div>
                            <div class="settings-item-desc" id="storage-usage">计算中...</div>
                        </div>
                        <svg class="settings-item-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                    <div class="settings-item" id="btn-clear-cache">
                        <div class="settings-item-content">
                            <div class="settings-item-label">清除缓存</div>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h2 class="section-title">关于</h2>
                    <div class="settings-item">
                        <div class="settings-item-content">
                            <div class="settings-item-label">版本</div>
                            <div class="settings-item-desc">1.1.1</div>
                        </div>
                    </div>
                    <div class="settings-item" id="btn-check-update">
                        <div class="settings-item-content">
                            <div class="settings-item-label">检查更新</div>
                            <div class="settings-item-desc">手动检测新版本</div>
                        </div>
                        <svg class="settings-item-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部标签栏（全局） -->
        <div class="tabbar">
            <button class="tab-item active" data-tab="home">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>图库</span>
            </button>
            <button class="tab-item" data-tab="settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6"></path>
                    <path d="m1 12 6-3 6 3"></path>
                </svg>
                <span>更多</span>
            </button>
        </div>
    </div>

    <!-- 全屏图片查看器 -->
    <div id="image-viewer" class="image-viewer" style="display: none;">
        <div class="image-viewer-topbar">
            <span class="image-viewer-counter" id="viewer-counter"></span>
            <button class="icon-btn" id="viewer-close" aria-label="关闭">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="image-viewer-content" id="viewer-content">
            <img id="viewer-image" alt="产品图片">
        </div>

        <div class="image-viewer-bottombar">
            <button class="viewer-action-btn" id="viewer-save">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                保存
            </button>
            <button class="viewer-action-btn" id="viewer-share">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                分享
            </button>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p class="loading-text" id="loading-text">加载中...</p>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- 隐藏的文件输入（用于ZIP导入） -->
    <input type="file" id="file-import-zip" accept=".zip" style="display: none;">

    <!-- JavaScript -->
    <script src="lib/jszip.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/image.js"></script>
    <script src="js/zip.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/add.js"></script>
    <script src="js/pages/detail.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
