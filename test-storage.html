<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB 测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <h1>IndexedDB 功能测试</h1>
    <p>点击下面的按钮测试浏览器的存储功能：</p>

    <button onclick="testIndexedDB()">测试 IndexedDB</button>
    <button onclick="testLocalStorage()">测试 localStorage</button>
    <button onclick="clearAll()">清除所有数据</button>

    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function addResult(message, isSuccess) {
            const div = document.createElement('div');
            div.className = `result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            results.appendChild(div);
        }

        async function testIndexedDB() {
            results.innerHTML = '';

            try {
                // 检查IndexedDB是否可用
                if (!window.indexedDB) {
                    addResult('❌ 您的浏览器不支持IndexedDB', false);
                    return;
                }

                addResult('✅ IndexedDB API 可用', true);

                // 尝试打开数据库
                const request = indexedDB.open('TestDB', 1);

                request.onerror = () => {
                    addResult(`❌ 无法打开IndexedDB: ${request.error}`, false);
                    addResult('💡 可能原因：浏览器隐私模式、存储被禁用或存储空间已满', false);
                };

                request.onsuccess = () => {
                    const db = request.result;
                    addResult('✅ IndexedDB 数据库打开成功', true);

                    // 尝试写入数据
                    const transaction = db.transaction(['test'], 'readwrite');
                    const store = transaction.objectStore('test');
                    const putRequest = store.put({ id: 1, data: 'test data', time: Date.now() });

                    putRequest.onsuccess = () => {
                        addResult('✅ 数据写入成功', true);
                        addResult('🎉 您的浏览器可以正常使用产品图库应用！', true);
                    };

                    putRequest.onerror = () => {
                        addResult(`❌ 数据写入失败: ${putRequest.error}`, false);
                    };

                    db.close();
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('test')) {
                        db.createObjectStore('test', { keyPath: 'id' });
                    }
                };

            } catch (error) {
                addResult(`❌ 测试失败: ${error.message}`, false);
            }
        }

        function testLocalStorage() {
            results.innerHTML = '';

            try {
                if (!window.localStorage) {
                    addResult('❌ 您的浏览器不支持localStorage', false);
                    return;
                }

                addResult('✅ localStorage API 可用', true);

                localStorage.setItem('test', 'test data');
                const data = localStorage.getItem('test');

                if (data === 'test data') {
                    addResult('✅ localStorage 读写正常', true);
                } else {
                    addResult('❌ localStorage 数据不匹配', false);
                }

                localStorage.removeItem('test');

            } catch (error) {
                addResult(`❌ localStorage 测试失败: ${error.message}`, false);
                addResult('💡 可能是隐私模式或存储被禁用', false);
            }
        }

        function clearAll() {
            results.innerHTML = '';

            try {
                // 清除IndexedDB
                indexedDB.deleteDatabase('TestDB');
                addResult('✅ IndexedDB 已清除', true);

                // 清除localStorage
                localStorage.clear();
                addResult('✅ localStorage 已清除', true);

            } catch (error) {
                addResult(`❌ 清除失败: ${error.message}`, false);
            }
        }

        // 显示浏览器信息
        window.addEventListener('load', () => {
            const info = document.createElement('div');
            info.className = 'result';
            info.innerHTML = `
                <strong>浏览器信息：</strong><br>
                User Agent: ${navigator.userAgent}<br>
                Cookie 启用: ${navigator.cookieEnabled ? '是' : '否'}<br>
                存储持久化: ${navigator.storage && navigator.storage.persisted ? '支持' : '不支持'}
            `;
            results.appendChild(info);
        });
    </script>
</body>

</html>
